# L'API : un Deployment de 2 copies (pods) identiques, derrière un Service qui répartit les requêtes.
# Les clés d'API viennent d'un Secret créé à partir de .env (jamais dans ce fichier) :
#   kubectl -n ragfr create secret generic ragfr-cles --from-env-file=.env
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ragfr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ragfr:0.1.0
          imagePullPolicy: Never # l'image est chargée dans le cluster par « kind load », pas téléchargée
          ports:
            - containerPort: 8000
          env:
            - name: QDRANT_URL
              value: http://qdrant:6333
          envFrom:
            - secretRef:
                name: ragfr-cles
          # Les deux sondes de la leçon 17 : /ready décide si le pod reçoit du trafic,
          # /health décide s'il faut le redémarrer.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ragfr
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
