[project]
name = "ragfr"
version = "0.1.0"
description = "RAG agentique sur les guides de cybersécurité de l'ANSSI, avec citations vérifiées et évaluation chiffrée"
readme = "README.md"
authors = [
    { name = "yahya bennouna", email = "yahyabennouna63@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "fr-core-news-md",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "litellm>=1.104.2",
    "mcp[cli]>=2.3.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "snowballstemmer>=3.1.1",
    "streamlit>=1.65.0",
    "uvicorn>=0.38",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
# Construire le corpus : scraping du catalogue et parsing des PDF (Docling, PyMuPDF).
ingestion = [
    "beautifulsoup4>=4.15.0",
    "docling>=2.135.0",
    "pymupdf>=1.28.2",
]
# Modèles locaux : embeddings denses, reranker, tokenizer du découpage (PyTorch).
modeles = [
    "sentence-transformers>=6.1.0",
]

[tool.uv]
# En local, tout est installé. L'image Docker de service n'installe que le cœur (voir Dockerfile).
default-groups = ["dev", "ingestion", "modeles"]

[tool.uv.sources]
fr-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
markers = ["slow: tests lents (Docling, modèles) : uv run pytest -m slow"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# E/F : erreurs de base, I : ordre des imports, UP : syntaxe Python moderne, B : bugs fréquents
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# La table de sélection garde une ligne par guide.
"scripts/build_corpus.py" = ["E501"]
