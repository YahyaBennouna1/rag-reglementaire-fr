[project]
name = "ragfr"
version = "0.1.0"
description = "RAG agentique sur les guides de cybersécurité de l'ANSSI, avec citations vérifiées et évaluation chiffrée"
readme = "README.md"
authors = [
    { name = "yahya bennouna", email = "yahyabennouna63@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
ragfr = "ragfr:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
