[project]
name = "ragfr"
version = "0.1.0"
description = "RAG agentique sur les guides de cybersécurité de l'ANSSI, avec citations vérifiées et évaluation chiffrée"
readme = "README.md"
authors = [
    { name = "yahya bennouna", email = "yahyabennouna63@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "docling>=2.135.0",
    "httpx>=0.28.1",
    "litellm>=1.104.2",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
ragfr = "ragfr:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
markers = ["slow: tests lents (Docling, modèles) : uv run pytest -m slow"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# E/F : erreurs de base, I : ordre des imports, UP : syntaxe Python moderne, B : bugs fréquents
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# La table de sélection garde une ligne par guide.
"scripts/build_corpus.py" = ["E501"]
