# RAG naïf : le point de départ de l'ablation
name: baseline

chunking:
  method: fixed # fixed | semantic | contextual
  size: 512 # en tokens
  overlap: 64

retrieval:
  mode: dense # dense | bm25 | hybrid
  top_k: 10
  reranker: false
  rerank_candidates: 30

llm:
  model: gemini/gemini-3.5-flash-lite
  temperature: 0.0
  judge_model: groq/openai/gpt-oss-120b
  fast_model: groq/qwen/qwen3.8-27b
