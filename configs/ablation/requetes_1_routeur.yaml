# Ablation requêtes : hybride pondéré + routeur (multi-query si vague, décomposition si multi-documents)
name: requetes_1_routeur

chunking:
  method: fixed # découpage à taille fixe (leçon 12)
  size: 512 # en tokens
  overlap: 64

retrieval:
  mode: hybrid # dense | bm25 | hybrid
  top_k: 10
  candidates: 50 # hybride : résultats de chaque moteur avant fusion
  rrf_k: 60
  bm25_weight: 2.0 # BM25 est nettement plus fort sur ce corpus (voir l'analyse d'erreurs)
  reranker: false
  rerank_candidates: 30

query:
  router: true
  hyde: false

llm:
  model: gemini/gemini-3.5-flash-lite
  temperature: 0.0
  judge_model: groq/openai/gpt-oss-120b
  fast_model: gemini/gemini-3.5-flash-lite
