# Configuration utilisée par le serveur MCP et l'API.
# C'est la meilleure configuration MESURÉE à ce jour ; elle change quand l'ablation trouve mieux.
name: production

chunking:
  method: fixed # fixed | semantic | contextual
  size: 512 # en tokens
  overlap: 64

retrieval:
  mode: bm25 # meilleur résultat mesuré (leçon 13, section 7)
  top_k: 10
  reranker: false
  rerank_candidates: 30

guardrails:
  enabled: true # balises neutralisées + détection d'injection en deux couches (leçon 23)

llm:
  model: gemini/gemini-3.5-flash-lite
  temperature: 0.0
  judge_model: groq/openai/gpt-oss-120b
  fast_model: gemini/gemini-3.5-flash-lite
